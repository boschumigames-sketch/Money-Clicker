<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyClicker</title>
<style>
:root {
  --bg:#0F1420; --panel:#161C2C; --panel2:#1D2438; --border:#262E42;
  --text:#E7E9EE; --dim:#8891A6; --gold:#D4A548; --green:#3FB68B; --red:#E2574C; --blue:#5FA8E0;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Segoe UI', Inter, Arial, sans-serif; }
#app { min-height:100vh; display:flex; flex-direction:column; }

.ticker-wrap { overflow:hidden; background:#0B0F18; border-bottom:1px solid var(--border); white-space:nowrap; }
.ticker-track { display:inline-flex; animation:scroll 40s linear infinite; padding:6px 0; }
.ticker-wrap:hover .ticker-track { animation-play-state:paused; }
@keyframes scroll { from{transform:translateX(0);} to{transform:translateX(-50%);} }
.ticker-item { display:inline-flex; align-items:center; gap:6px; padding:0 18px; font-family:'Consolas',monospace; font-size:12px; border-right:1px solid var(--border); }
.ticker-item b { color:var(--dim); }
.up { color:var(--green); } .down { color:var(--red); }

.topbar { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--border); }
.brand { font-weight:700; font-size:18px; display:flex; align-items:center; gap:8px; }
.stats { display:flex; gap:22px; flex-wrap:wrap; }
.stat { display:flex; flex-direction:column; }
.stat .label { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
.stat .value { font-family:'Consolas',monospace; font-weight:700; font-size:15px; }
.gold{color:var(--gold);} .green{color:var(--green);} .blue{color:var(--blue);}

.banner { background:rgba(212,165,72,.12); border:1px solid var(--gold); color:var(--gold); padding:8px 16px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; }

.tabs { display:flex; gap:4px; padding:8px 14px; border-bottom:1px solid var(--border); overflow-x:auto; }
.tab { background:transparent; border:none; color:var(--dim); padding:8px 14px; border-radius:8px; display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; white-space:nowrap; font-family:inherit; }
.tab:hover { background:var(--panel); color:var(--text); }
.tab.active { background:var(--panel2); color:var(--gold); }

.content { flex:1; padding:20px; max-width:1100px; margin:0 auto; width:100%; }

.start-view { display:flex; flex-direction:column; gap:24px; max-width:640px; margin:0 auto; }
.chart-panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
.chart-title { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); margin-bottom:6px; }
.click-zone { display:flex; flex-direction:column; align-items:center; gap:10px; }
.click-btn { position:relative; width:190px; height:190px; border-radius:50%; border:3px solid var(--gold); background:radial-gradient(circle at 35% 30%, #2a2314, var(--panel2)); color:var(--gold); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:15px; cursor:pointer; }
.click-btn:active { transform:scale(.94); }
.click-btn span.icon { font-size:40px; }
.click-sub { color:var(--dim); font-size:12px; text-align:center; }
.burst { position:absolute; top:-6px; color:var(--gold); font-family:'Consolas',monospace; font-weight:700; font-size:13px; animation:floatUp .9s ease forwards; pointer-events:none; }
@keyframes floatUp { from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-46px);} }

.upgrades-view { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
@media (max-width:720px){ .upgrades-view{grid-template-columns:1fr;} }
.upgrade-col h3 { margin-bottom:10px; }
.upgrade-card { position:relative; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; }
.upgrade-top { display:flex; justify-content:space-between; gap:8px; }
.upgrade-name { font-weight:600; font-size:14px; }
.upgrade-desc { color:var(--dim); font-size:12px; margin-top:2px; }
.info-btn { background:transparent; border:1px solid var(--border); color:var(--dim); border-radius:6px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.upgrade-bottom { display:flex; justify-content:space-between; font-size:12px; margin:8px 0; font-family:'Consolas',monospace; }
.buy-btn { width:100%; padding:8px; border-radius:8px; border:none; background:var(--gold); color:#1a1406; font-weight:700; cursor:pointer; }
.buy-btn.disabled { background:var(--border); color:var(--dim); cursor:not-allowed; }
.tooltip { display:none; position:absolute; z-index:5; top:calc(100% + 6px); left:0; right:0; background:#10141F; border:1px solid var(--gold); border-radius:8px; padding:10px; font-size:12px; box-shadow:0 8px 24px rgba(0,0,0,.4); }
.upgrade-card:hover .tooltip, .upgrade-card.show-tooltip .tooltip { display:block; }
.tooltip-row { display:flex; justify-content:space-between; padding:2px 0; }
.tooltip-row.dim { color:var(--dim); border-top:1px dashed var(--border); margin-top:4px; padding-top:6px; }

.ms-view { display:flex; flex-direction:column; gap:22px; }
.ms-branch-label { font-weight:700; margin-bottom:10px; font-size:14px; letter-spacing:.03em; }
.ms-chain { display:flex; gap:14px; flex-wrap:wrap; }
.ms-node { width:190px; background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:10px; padding:12px; opacity:.55; }
.ms-node.achieved { opacity:1; box-shadow:0 0 0 1px var(--accent) inset, 0 0 18px -6px var(--accent); }
.ms-node.locked { opacity:.35; }
.ms-icon { width:26px; height:26px; border-radius:50%; background:var(--accent); color:#0F1420; display:flex; align-items:center; justify-content:center; margin-bottom:8px; font-size:13px; }
.ms-node.locked .ms-icon { background:var(--border); color:var(--dim); }
.ms-name { font-weight:700; font-size:13px; }
.ms-desc { font-size:11px; color:var(--dim); margin:4px 0 8px; }
.ms-progress { height:5px; border-radius:3px; background:#0B0F18; overflow:hidden; margin-bottom:6px; }
.ms-progress-bar { height:100%; background:var(--accent); }
.ms-reward { font-size:11px; color:var(--accent); font-weight:600; }

.stocks-view, .depot-view { display:flex; flex-direction:column; gap:16px; }
.portfolio-summary { display:flex; gap:24px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 16px; font-size:13px; }
.stock-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px; }
.stock-panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; }
.stock-head { display:flex; justify-content:space-between; align-items:flex-start; }
.stock-name { font-weight:700; font-size:13px; }
.stock-symbol { color:var(--dim); font-size:11px; font-family:'Consolas',monospace; }
.stock-price-row { display:flex; align-items:center; gap:8px; margin-top:4px; }
.stock-price { font-family:'Consolas',monospace; font-size:16px; font-weight:700; }
.range-toggle, .mode-toggle { display:flex; background:#0B0F18; border-radius:6px; overflow:hidden; border:1px solid var(--border); }
.range-toggle button, .mode-toggle button { background:transparent; border:none; color:var(--dim); padding:4px 8px; font-size:11px; cursor:pointer; font-family:inherit; }
.range-toggle button.active, .mode-toggle button.active { background:var(--panel2); color:var(--gold); }
.stock-holdings { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
canvas.chart-canvas { width:100%; height:110px; display:block; }
.trade-row { display:flex; gap:8px; }
.trade-row input, .depot-sell input { flex:1; background:#0B0F18; border:1px solid var(--border); border-radius:6px; padding:6px 8px; color:var(--text); font-size:12px; min-width:0; }
.trade-buttons, .depot-sell { display:flex; gap:8px; }
.trade-buttons button, .depot-sell button { flex:1; padding:7px; border-radius:7px; border:none; font-weight:700; cursor:pointer; font-size:12px; }
.trade-buttons .buy { background:var(--green); color:#05130d; }
.trade-buttons .sell, .depot-sell .sell { background:var(--red); color:#1a0705; }
.depot-sell .sell.all { background:var(--panel2); color:var(--red); border:1px solid var(--red); }

.depot-empty { display:flex; flex-direction:column; align-items:center; gap:10px; padding:40px 20px; color:var(--dim); text-align:center; background:var(--panel); border:1px dashed var(--border); border-radius:12px; }
.depot-list { display:flex; flex-direction:column; gap:10px; }
.depot-row { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
.depot-row-main { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.depot-row-right { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.dim { color:var(--dim); font-size:12px; }

.settings-view { max-width:480px; }
.danger-btn { background:var(--red); color:#1a0705; border:none; padding:10px 16px; border-radius:8px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:8px; }
.confirm-box { background:var(--panel); border:1px solid var(--red); border-radius:10px; padding:16px; margin-top:12px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.confirm-actions { display:flex; gap:10px; margin-top:6px; }
.cancel-btn { background:var(--panel2); color:var(--text); border:1px solid var(--border); padding:10px 16px; border-radius:8px; cursor:pointer; }
.save-row { display:flex; align-items:center; gap:10px; margin:14px 0; flex-wrap:wrap; }
.save-btn { background:var(--panel2); border:1px solid var(--gold); color:var(--gold); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:700; }
.save-status { font-size:12px; color:var(--dim); }
.save-status.ok { color:var(--green); }
.save-status.error { color:var(--red); }

.ms-toast { position:fixed; bottom:20px; right:20px; background:#10141F; border:1px solid var(--accent); border-left:4px solid var(--accent); border-radius:10px; padding:12px 16px; display:flex; gap:10px; align-items:flex-start; max-width:280px; box-shadow:0 10px 30px rgba(0,0,0,.5); z-index:50; }
.event-incoming { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#10141F; border:1px solid var(--gold); border-radius:12px; padding:12px 18px; display:flex; align-items:center; gap:10px; box-shadow:0 10px 30px rgba(0,0,0,.5); z-index:90; max-width:320px; }
.bell-ring { font-size:18px; animation:ring 1s ease-in-out infinite; display:inline-block; }
@keyframes ring { 0%,100%{transform:rotate(0);} 20%{transform:rotate(12deg);} 40%{transform:rotate(-10deg);} 60%{transform:rotate(6deg);} 80%{transform:rotate(-4deg);} }
.event-overlay { position:fixed; inset:0; background:rgba(6,8,14,.75); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
.event-modal { background:var(--panel); border:1px solid var(--gold); border-radius:14px; padding:22px; max-width:420px; width:100%; }
.event-tag { color:var(--gold); font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-bottom:10px; }
.event-text { font-size:14px; line-height:1.5; margin-bottom:16px; }
.event-options { display:flex; flex-direction:column; gap:10px; }
.event-options button { background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:12px; border-radius:9px; text-align:left; cursor:pointer; font-size:13px; font-family:inherit; }
.event-options button:hover { border-color:var(--gold); }
.event-outcome { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 0; text-align:center; }
.event-outcome.good { color:var(--green); }
.event-outcome.bad { color:var(--red); }
.event-outcome-pct { font-family:'Consolas',monospace; font-size:22px; font-weight:700; }
.loading-screen { display:flex; align-items:center; justify-content:center; height:100vh; gap:10px; color:var(--dim); }
</style>
</head>

const fmt = (num, withEuro = true) => {
  const sign = num < 0 ? "-" : "";
  let n = Math.abs(num || 0);
  let out;
  if (n < 1000) {
    out = n < 10 ? n.toFixed(2) : n.toFixed(n % 1 === 0 ? 0 : 1);
  } else {
    const units = ["K","M","B","T","Qa"];
    let i = -1;
    while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
    out = n.toFixed(n < 10 ? 2 : 1) + units[i];
  }
  return withEuro ? `${sign}${out} €` : `${sign}${out}`;
};
const fmtPct = (p) => `${p >= 0 ? "+" : ""}${p.toFixed(2)}%`;

  passiveUpgrades: Object.fromEntries(PASSIVE_UPGRADES.map(u=>[u.id,0])),
  milestonesAchieved: [],
  clickMult:1, passiveMult:1, flatClickBonus:0, flatPassiveBonus:0,
  eventStreak:0,
  stocks: STOCKS_INIT.map(s=>({...s, shares:0, history1d:Array.from({length:24},()=>s.price), history7d:Array.from({length:7},()=>s.price)})),
  netWorthHistory: [],
  uiStockRange: {},
};
let currentTab = "start";
let pendingEvent = null, eventPhase = null, eventOutcome = null;
let eventCooldown = 20, lastEventIdx = -1;
let resetConfirmUI = false;
let saveStatus = "idle", lastSavedAt = null;
let depotSignature = "";
let tickCount = 0;

/* ============================== DERIVED ============================== */
function clickValueFinal() {
  const base = 1 + CLICK_UPGRADES.reduce((sum,u)=>sum+u.baseEffect*S.clickUpgrades[u.id],0);
  return (base + S.flatClickBonus) * S.clickMult;
}
function passiveIncomeFinal() {
  const base = PASSIVE_UPGRADES.reduce((sum,u)=>sum+u.baseEffect*S.passiveUpgrades[u.id],0);
  return (base + S.flatPassiveBonus) * S.passiveMult;
}
function portfolioValue() { return S.stocks.reduce((sum,s)=>sum+s.shares*s.price,0); }
function netWorth() { return S.money + portfolioValue(); }
function upgradesBought() { return Object.values(S.clickUpgrades).reduce((a,b)=>a+b,0) + Object.values(S.passiveUpgrades).reduce((a,b)=>a+b,0); }
function maxUpgradeLevel() { return Math.max(0, ...Object.values(S.clickUpgrades), ...Object.values(S.passiveUpgrades)); }
function diversification() { return S.stocks.filter(s=>s.shares>0).length; }
function getProgress(m) {
  switch(m.type) {
    case "networth": return netWorth();
    case "clicks": return S.totalClicks;
    case "upgradesBought": return upgradesBought();
    case "maxUpgradeLevel": return maxUpgradeLevel();
    case "sharesOwned": return S.stocks.some(s=>s.shares>0) ? 1 : 0;
    case "portfolioValue": return portfolioValue();
    case "diversification": return diversification();
    case "eventStreak": return S.eventStreak;
    default: return 0;
  }
}

/* ============================== SAVE / LOAD ============================== */
function saveGame() {
  try {
    const payload = {
      money: S.money, totalClicks: S.totalClicks,
      clickUpgrades: S.clickUpgrades, passiveUpgrades: S.passiveUpgrades,
      milestonesAchieved: S.milestonesAchieved,
      clickMult: S.clickMult, passiveMult: S.passiveMult,
      flatClickBonus: S.flatClickBonus, flatPassiveBonus: S.flatPassiveBonus,
      eventStreak: S.eventStreak,
      stocks: S.stocks.map(s=>({id:s.id, price:s.price, shares:s.shares, history1d:s.history1d, history7d:s.history7d})),
      lastSaveTime: Date.now(),
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    saveStatus = "ok"; lastSavedAt = Date.now();
  } catch (e) {
    console.error("MoneyClicker: Speichern fehlgeschlagen", e);
    saveStatus = "error";
  }
  if (currentTab === "einstellungen") renderTab();
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    console.error("MoneyClicker: Laden fehlgeschlagen", e);
    return null;
  }
}

/* ============================== REWARDS / MILESTONES ============================== */
function applyReward(r) {
  if (r.type === "clickMult") S.clickMult += r.value;
  if (r.type === "passiveMult") S.passiveMult += r.value;
  if (r.type === "allMult") { S.clickMult += r.value; S.passiveMult += r.value; }
  if (r.type === "clickFlat") S.flatClickBonus += r.value;
  if (r.type === "passiveFlat") S.flatPassiveBonus += r.value;
  if (r.type === "money") S.money += r.value;
}
function checkMilestones() {
  let changed = false;
  MILESTONES.forEach(m => {
    if (S.milestonesAchieved.includes(m.id)) return;
    if (m.requires && !S.milestonesAchieved.includes(m.requires)) return;
    if (getProgress(m) >= m.target) {
      S.milestonesAchieved.push(m.id);
      applyReward(m.reward);
      changed = true;
      showMsToast(m);
    }
  });
  if (changed) saveGame();
}
function showMsToast(m) {
  const el = document.getElementById("msToast");
  const meta = BRANCH_META[m.branch];
  el.style.setProperty("--accent", meta.color);
  el.innerHTML = `<span style="font-size:18px">🏆</span><div><b>Meilenstein erreicht:</b> ${esc(m.name)}<div class="dim">${esc(m.rewardLabel)}</div></div>`;
  el.style.display = "flex";
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.display="none"; }, 4000);
}

/* ============================== CANVAS CHARTS ============================== */
function drawChart(canvas, data, color) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 260, h = canvas.clientHeight || 110;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if (!data || data.length < 2) return;
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max-min) || Math.abs(max) || 1;
  const stepX = w/(data.length-1);
  const pad = h*0.08;
  ctx.beginPath();
  data.forEach((v,i)=>{
    const x = i*stepX;
    const y = h - pad - ((v-min)/range)*(h-2*pad);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin="round"; ctx.stroke();
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
  ctx.fillStyle = color + "22"; ctx.fill();
}

/* ============================== ACTIONS ============================== */
function doClick(e) {
  const val = clickValueFinal();
  S.money += val;
  S.totalClicks++;
  const btn = document.getElementById("clickBtn");
  if (btn) {
    const burst = document.createElement("span");
    burst.className = "burst";
    burst.style.left = `calc(50% + ${(Math.random()-0.5)*60}px)`;
    burst.textContent = "+" + fmt(val);
    btn.appendChild(burst);
    setTimeout(()=>burst.remove(), 900);
  }
  checkMilestones();
  refreshHeader();
  refreshStart();
}
function buyClickUpgrade(id) {
  const level = S.clickUpgrades[id];
  const u = CLICK_UPGRADES.find(x=>x.id===id);
  const cost = Math.round(u.baseCost * Math.pow(1.15, level));
  if (S.money < cost) return;
  S.money -= cost;
  S.clickUpgrades[id] = level+1;
  checkMilestones();
  saveGame();
  refreshHeader();
  renderTab();
}
function buyPassiveUpgrade(id) {
  const level = S.passiveUpgrades[id];
  const u = PASSIVE_UPGRADES.find(x=>x.id===id);
  const cost = Math.round(u.baseCost * Math.pow(1.15, level));
  if (S.money < cost) return;
  S.money -= cost;
  S.passiveUpgrades[id] = level+1;
  checkMilestones();
  saveGame();
  refreshHeader();
  renderTab();
}
function handleTrade(stockId, shareCount, action) {
  if (!shareCount || shareCount <= 0) return;
  const s = S.stocks.find(x=>x.id===stockId);
  if (!s) return;
  if (action === "buy") {
    const cost = shareCount * s.price;
    if (cost > S.money) return;
    S.money -= cost;
    s.shares += shareCount;
  } else {
    const sellQty = Math.min(shareCount, s.shares);
    if (sellQty <= 0) return;
    S.money += sellQty * s.price;
    s.shares -= sellQty;
  }
  checkMilestones();
  saveGame();
  refreshHeader();
  renderTab();
}
function triggerRandomEvent() {
  let idx = Math.floor(Math.random()*EVENTS.length);
  if (EVENTS.length > 1) { while (idx === lastEventIdx) idx = Math.floor(Math.random()*EVENTS.length); }
  lastEventIdx = idx;
  const stockTarget = Math.random() < 0.35 ? S.stocks[Math.floor(Math.random()*S.stocks.length)].id : null;
  pendingEvent = { ...EVENTS[idx], stockTarget, key: uid() };
  eventPhase = "incoming";
  renderEventUI();
  setTimeout(()=>{
    if (!pendingEvent) return;
    eventPhase = "choice";
    renderEventUI();
  }, 10000);
}
function resolveEvent(chooseA) {
  if (!pendingEvent) return;
  const correct = chooseA === pendingEvent.correctA;
  let pct = correct ? rand(10,25) : -rand(5,10);
  let targetSymbol = null;
  if (pendingEvent.stockTarget) {
    const s = S.stocks.find(x=>x.id===pendingEvent.stockTarget);
    if (s) { s.price = Math.max(0.05, Math.round(s.price*(1+pct/100)*100)/100); targetSymbol = s.symbol; }
  } else {
    S.money = Math.max(0, S.money*(1+pct/100));
  }
  S.eventStreak = correct ? S.eventStreak+1 : 0;
  eventOutcome = { correct, pct, target: targetSymbol };
  renderEventUI();
  checkMilestones();
  saveGame();
  refreshHeader();
  setTimeout(()=>{
    pendingEvent = null; eventOutcome = null; eventPhase = null;
    renderEventUI();
  }, 2200);
}
function doReset() {
  S = {
    money:0, totalClicks:0,
    clickUpgrades: Object.fromEntries(CLICK_UPGRADES.map(u=>[u.id,0])),
    passiveUpgrades: Object.fromEntries(PASSIVE_UPGRADES.map(u=>[u.id,0])),
    milestonesAchieved: [],
    clickMult:1, passiveMult:1, flatClickBonus:0, flatPassiveBonus:0,
    eventStreak:0,
    stocks: STOCKS_INIT.map(s=>({...s, shares:0, history1d:Array.from({length:24},()=>s.price), history7d:Array.from({length:7},()=>s.price)})),
    netWorthHistory: [],
    uiStockRange: {},
  };
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
  resetConfirmUI = false;
  refreshHeader();
  renderTab();
}

/* ============================== TAB BUILDING ============================== */
const TABS = [
  ["start","Start","👆"],
  ["upgrades","Upgrades","📈"],
  ["meilensteine","Meilensteine","🏆"],
  ["boerse","Börse","🏦"],
  ["depot","Depot","💼"],
  ["einstellungen","Einstellungen","⚙️"],
];

function renderTabsNav() {
  const el = document.getElementById("tabs");
  el.innerHTML = TABS.map(([id,label,icon]) =>
    `<button class="tab ${currentTab===id?'active':''}" data-tab="${id}">${icon} ${label}</button>`
  ).join("");
  el.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ currentTab = btn.dataset.tab; renderTabsNav(); renderTab(); });
  });
}

function renderTab() {
  const el = document.getElementById("content");
  if (currentTab === "start") { el.innerHTML = buildStartTab(); attachStartHandlers(); refreshStart(); }
  else if (currentTab === "upgrades") { el.innerHTML = buildUpgradesTab(); attachUpgradesHandlers(); }
  else if (currentTab === "meilensteine") { el.innerHTML = buildMilestonesTab(); }
  else if (currentTab === "boerse") { el.innerHTML = buildBoerseTab(); attachBoerseHandlers(); refreshBoerse(); }
  else if (currentTab === "depot") { el.innerHTML = buildDepotTab(); attachDepotHandlers(); depotSignature = S.stocks.filter(s=>s.shares>0).map(s=>s.id).join(","); }
  else if (currentTab === "einstellungen") { el.innerHTML = buildSettingsTab(); attachSettingsHandlers(); }
}

}

}

function attachUpgradesHandlers() {
  document.querySelectorAll("[data-buy]").forEach(btn=>{
    const id = btn.dataset.buy;

  });

function buildMilestonesTab() {
  const branches = Object.entries(BRANCH_META).map(([branchId, meta]) => {
    const nodes = MILESTONES.filter(m=>m.branch===branchId).sort((a,b)=>a.tier-b.tier).map(m=>{
      const achieved = S.milestonesAchieved.includes(m.id);
      const unlocked = !m.requires || S.milestonesAchieved.includes(m.requires);
      const progress = getProgress(m);
      const pct = clamp((progress/m.target)*100,0,100);
      return `
      <div class="ms-node ${achieved?'achieved':unlocked?'':'locked'}" style="--accent:${meta.color}">
        <div class="ms-icon">${achieved?'✓':unlocked?'🏆':'🔒'}</div>
        <div class="ms-name">${esc(m.name)}</div>
        <div class="ms-desc">${esc(m.desc)}</div>
        ${!achieved && unlocked ? `<div class="ms-progress"><div class="ms-progress-bar" style="width:${pct}%"></div></div>` : ""}
        <div class="ms-reward">${esc(m.rewardLabel)}</div>
      </div>`;
    }).join("");
    return `<div class="ms-branch"><div class="ms-branch-label" style="color:${meta.color}">${meta.label}</div><div class="ms-chain">${nodes}</div></div>`;
  }).join("");
  return `<div class="ms-view">${branches}</div>`;
}

      handleTrade(id, qty, "sell");
    });
    row.querySelector('[data-sell="all"]').addEventListener("click", ()=>{
      const s = S.stocks.find(x=>x.id===id);
      handleTrade(id, s.shares, "sell");
    });
  });
}
function refreshDepot() {
  if (currentTab !== "depot") return;
  const sig = S.stocks.filter(s=>s.shares>0).map(s=>s.id).join(",");
  if (sig !== depotSignature) { renderTab(); return; }
  const summary = document.querySelector(".portfolio-summary");
  if (summary) summary.innerHTML = `
    <span>Depotwert: <b>${fmt(portfolioValue())}</b></span>
    <span>Kontostand: <b>${fmt(S.money)}</b></span>
    <span>Positionen: <b>${diversification()}</b></span>`;
  S.stocks.filter(s=>s.shares>0).forEach(s=>{
    const row = document.querySelector(`.depot-row[data-stock="${s.id}"]`);
    if (!row) return;
    const data = s.history1d;
    const first = data[0] || s.price;
    const change = ((s.price-first)/first)*100;
    const up = change >= 0;
    row.querySelector('[data-field="meta"]').textContent = `${s.shares.toFixed(4)} Anteile · Kurs ${s.price.toFixed(2)} €`;
    row.querySelector('[data-field="value"]').textContent = fmt(s.shares*s.price);
    const chEl = row.querySelector('[data-field="change"]');
    chEl.textContent = (up?'▲ ':'▼ ') + fmtPct(change);
    chEl.className = up ? "up" : "down";
  });
}

function buildSettingsTab() {
  const savedTxt = lastSavedAt ? `Zuletzt gespeichert vor ${Math.max(0, Math.round((Date.now()-lastSavedAt)/1000))}s` : "Noch nicht gespeichert";
  const statusClass = saveStatus === "ok" ? "ok" : saveStatus === "error" ? "error" : "";
  return `
    <div class="settings-view">
      <h3>Einstellungen</h3>
      <p class="dim">Dein Fortschritt wird automatisch alle paar Sekunden lokal in diesem Browser gespeichert (localStorage). Das Speichern funktioniert nur auf diesem Gerät/Browser — schickst du die Datei an Freunde, startet dort jeder mit einem eigenen, unabhängigen Spielstand.</p>
      <div class="save-row">
        <button class="save-btn" id="manualSaveBtn">💾 Jetzt speichern</button>
        <span class="save-status ${statusClass}" id="saveStatusText">${savedTxt}${saveStatus==='error' ? ' · Fehler beim Speichern' : ''}</span>
      </div>
      ${!resetConfirmUI ? `
      <button class="danger-btn" id="resetBtn">↺ Spielstand zurücksetzen</button>` : `
      <div class="confirm-box">
        ⚠️
        <p>Bist du sicher? Dieser Vorgang kann nicht rückgängig gemacht werden — Geld, Upgrades, Meilensteine und Portfolio gehen verloren.</p>
        <div class="confirm-actions">
          <button class="danger-btn" id="confirmResetBtn">Ja, zurücksetzen</button>
          <button class="cancel-btn" id="cancelResetBtn">Abbrechen</button>
        </div>
      </div>`}
    </div>`;
}
function attachSettingsHandlers() {
  document.getElementById("manualSaveBtn").addEventListener("click", saveGame);
  if (!resetConfirmUI) {
    document.getElementById("resetBtn").addEventListener("click", ()=>{ resetConfirmUI = true; renderTab(); });
  } else {
    document.getElementById("confirmResetBtn").addEventListener("click", doReset);
    document.getElementById("cancelResetBtn").addEventListener("click", ()=>{ resetConfirmUI = false; renderTab(); });
  }
}
function refreshSettings() {
  if (currentTab !== "einstellungen") return;
  const el = document.getElementById("saveStatusText");
  if (!el) return;
  const savedTxt = lastSavedAt ? `Zuletzt gespeichert vor ${Math.max(0, Math.round((Date.now()-lastSavedAt)/1000))}s` : "Noch nicht gespeichert";
  el.textContent = savedTxt + (saveStatus==='error' ? ' · Fehler beim Speichern' : '');
  el.className = "save-status " + (saveStatus === "ok" ? "ok" : saveStatus === "error" ? "error" : "");
}

/* ============================== HEADER / TICKER ============================== */
function refreshHeader() {
  document.getElementById("statMoney").textContent = fmt(S.money);
  document.getElementById("statPortfolio").textContent = fmt(portfolioValue());
  document.getElementById("statPassive").textContent = fmt(passiveIncomeFinal());
  document.getElementById("statClick").textContent = fmt(clickValueFinal());
}
function renderTicker() {
  const track = document.getElementById("tickerTrack");
  const items = [...S.stocks, ...S.stocks].map(s=>{
    const first = s.history1d[0] || s.price;
    const change = ((s.price-first)/first)*100;
    const up = change >= 0;
    return `<span class="ticker-item"><b>${s.symbol}</b><span>${s.price.toFixed(2)} €</span><span class="${up?'up':'down'}">${up?'▲':'▼'} ${fmtPct(change)}</span></span>`;
  }).join("");
  track.innerHTML = items;
}

/* ============================== EVENT UI ============================== */
function renderEventUI() {
  const incomingEl = document.getElementById("eventIncoming");
  const overlayEl = document.getElementById("eventOverlay");
  if (eventPhase === "incoming") {
    incomingEl.style.display = "flex";
    incomingEl.innerHTML = `<span class="bell-ring">🔔</span><div><b>Eine Entscheidung steht bevor…</b><div class="dim">Gleich musst du zwischen zwei Optionen wählen. Mach dich bereit.</div></div>`;
    overlayEl.style.display = "none";
  } else if (eventPhase === "choice" && pendingEvent) {
    incomingEl.style.display = "none";
    overlayEl.style.display = "flex";
    const modal = document.getElementById("eventModal");
    if (!eventOutcome) {
      const targetTag = pendingEvent.stockTarget ? ` · ${S.stocks.find(s=>s.id===pendingEvent.stockTarget)?.symbol}` : "";
      modal.innerHTML = `
        <div class="event-tag">Entscheidung gefragt${targetTag}</div>
        <p class="event-text">${esc(pendingEvent.text)}</p>
        <div class="event-options">
          <button id="evA">${esc(pendingEvent.a)}</button>
          <button id="evB">${esc(pendingEvent.b)}</button>
        </div>`;
      document.getElementById("evA").addEventListener("click", ()=>resolveEvent(true));
      document.getElementById("evB").addEventListener("click", ()=>resolveEvent(false));
    } else {
      modal.innerHTML = `
        <div class="event-outcome ${eventOutcome.correct?'good':'bad'}">
          <span style="font-size:26px">${eventOutcome.correct?'✔':'✘'}</span>
          <div class="event-outcome-pct">${fmtPct(eventOutcome.pct)}</div>
          <div>${eventOutcome.correct?'Kluge Entscheidung!':'Das Risiko hat sich nicht ausgezahlt.'}</div>
          ${eventOutcome.target ? `<div class="dim">Aktie: ${eventOutcome.target}</div>` : ""}
        </div>`;
    }
  } else {
    incomingEl.style.display = "none";
    overlayEl.style.display = "none";
  }
}

/* ============================== GAME LOOP ============================== */
function tick() {
  tickCount++;
  S.money += passiveIncomeFinal();

  if (tickCount % 2 === 0) {
    S.netWorthHistory.push(Math.round(netWorth()*100)/100);
    if (S.netWorthHistory.length > 50) S.netWorthHistory.shift();
  }

  if (tickCount % 5 === 0) {
    S.stocks.forEach(s=>{
      const pct = s.trend + rand(-1,1)*s.vol;
      const newPrice = Math.max(0.05, s.price*(1+pct));
      s.history1d.push(newPrice); s.history1d.shift();
      if ((tickCount/5) % 24 === 0) { s.history7d.push(newPrice); s.history7d.shift(); }
      s.price = Math.round(newPrice*100)/100;
    });
  }

  eventCooldown--;
  if (eventCooldown <= 0 && eventPhase === null) {
    if (Math.random() < 0.35) triggerRandomEvent();
    eventCooldown = Math.floor(rand(26,44));
  }

  checkMilestones();
  refreshHeader();
  renderTicker();
  refreshStart();
  refreshBoerse();
  refreshDepot();
  refreshSettings();
}

/* ============================== INIT ============================== */
function buildAppShell() {
  document.getElementById("app").innerHTML = `
    <div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>
    <div class="topbar">
      <div class="brand">🪙 MoneyClicker</div>
      <div class="stats">
        <div class="stat"><span class="label">Kontostand</span><span class="value gold" id="statMoney">0 €</span></div>
        <div class="stat"><span class="label">Depotwert</span><span class="value" id="statPortfolio">0 €</span></div>
        <div class="stat"><span class="label">€ / Sek.</span><span class="value green" id="statPassive">0 €</span></div>
        <div class="stat"><span class="label">€ / Klick</span><span class="value blue" id="statClick">0 €</span></div>
      </div>
    </div>
    <div id="offlineBanner" class="banner" style="display:none"></div>
    <nav class="tabs" id="tabs"></nav>
    <main class="content" id="content"></main>
    <div id="msToast" class="ms-toast" style="display:none"></div>
    <div id="eventIncoming" class="event-incoming" style="display:none"></div>
    <div id="eventOverlay" class="event-overlay" style="display:none"><div class="event-modal" id="eventModal"></div></div>
  `;
}

function init() {
  buildAppShell();

  const saved = loadGame();
  if (saved) {
    S.money = saved.money ?? 0;
    S.totalClicks = saved.totalClicks ?? 0;
    S.clickUpgrades = { ...S.clickUpgrades, ...(saved.clickUpgrades||{}) };
    S.passiveUpgrades = { ...S.passiveUpgrades, ...(saved.passiveUpgrades||{}) };
    S.milestonesAchieved = saved.milestonesAchieved || [];
    S.clickMult = saved.clickMult ?? 1;
    S.passiveMult = saved.passiveMult ?? 1;
    S.flatClickBonus = saved.flatClickBonus ?? 0;
    S.flatPassiveBonus = saved.flatPassiveBonus ?? 0;
    S.eventStreak = saved.eventStreak ?? 0;
    if (saved.stocks) {
      S.stocks.forEach(s=>{
        const sv = saved.stocks.find(x=>x.id===s.id);
        if (sv) { s.price = sv.price; s.shares = sv.shares; s.history1d = sv.history1d; s.history7d = sv.history7d; }
      });
    }
    if (saved.lastSaveTime) {
      const elapsedSec = clamp((Date.now()-saved.lastSaveTime)/1000, 0, 8*3600);
      const savedPassiveBase = PASSIVE_UPGRADES.reduce((sum,u)=>sum+u.baseEffect*(saved.passiveUpgrades?.[u.id]||0),0) + (saved.flatPassiveBonus||0);
      const savedPassive = savedPassiveBase * (saved.passiveMult ?? 1);
      const earned = savedPassive * elapsedSec;
      if (earned > 1) {
        S.money += earned;
        const banner = document.getElementById("offlineBanner");
        banner.textContent = `Willkommen zurück! Während du weg warst, hast du ${fmt(earned)} verdient. ✕`;
        banner.style.display = "flex";
        banner.addEventListener("click", ()=>{ banner.style.display = "none"; });
      }
    }
  }

  renderTabsNav();
  renderTab();
  refreshHeader();
  renderTicker();

  setInterval(tick, 1000);
  setInterval(saveGame, 5000);
  window.addEventListener("beforeunload", saveGame);
  document.addEventListener("visibilitychange", ()=>{ if (document.hidden) saveGame(); });

  saveGame();
}

init();
</script>
